version: "3"

vars:
  BINARY: scafctl-plugin-hcl
  # Provider name users reference in solutions (provider: hcl).
  PROVIDER: hcl
  # Host CLI used for local catalog installs; override with CLI=... if needed.
  CLI: '{{default "scafctl" .CLI}}'
  DIST: "{{.ROOT_DIR | toSlash}}/dist"
  COVER: "{{.ROOT_DIR | toSlash}}/cover"
  VERSION: '{{default "" .VERSION}}'
  # Executable suffix so cross-platform (Windows) builds resolve correctly.
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the plugin binary
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.DIST}}/{{.BINARY}}{{.EXE}}"
    cmds:
      - mkdir -p {{.DIST}}
      - >-
        go build -ldflags "-s -w"
        -o {{.DIST}}/{{.BINARY}}{{.EXE}}
        ./cmd/{{.BINARY}}/

  test:
    desc: Run tests
    cmds:
      - go test -race -count=1 -shuffle=on -timeout 5m ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - mkdir -p {{.COVER}}
      - go test -race -coverprofile={{.COVER}}/cover.out -covermode=atomic ./...

  test:solution:
    desc: Install the plugin locally and run the example solution's functional tests
    deps: [publish:local]
    dir: examples/terraform-module-scaffold
    cmds:
      - '{{.CLI}} test functional -f solution.yaml --verbose'

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run linter with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -run='^$' -bench='.' -benchmem -count=1 ./...

  publish:local:
    desc: Build and install the plugin into the local catalog for end-to-end testing
    deps: [build]
    cmds:
      - >-
        {{.CLI}} build plugin --force
        --name {{.PROVIDER}}
        --kind provider
        --version {{default "0.1.0" .VERSION}}
        --platform {{OS}}/{{ARCH}}={{.DIST}}/{{.BINARY}}{{.EXE}}

  release:local:
    desc: "Build and install a versioned local catalog artifact (usage: task release:local VERSION=2.0.1)"
    deps: [build]
    requires:
      vars: [VERSION]
    cmds:
      - >-
        {{.CLI}} build plugin --force
        --name {{.PROVIDER}}
        --kind provider
        --version {{.VERSION}}
        --platform {{OS}}/{{ARCH}}={{.DIST}}/{{.BINARY}}{{.EXE}}

  release:tag:
    desc: "Create and push a signed release tag, triggering the CI release workflow (usage: task release:tag VERSION=2.0.1)"
    requires:
      vars: [VERSION]
    cmds:
      - git tag -s v{{.VERSION}} -m "v{{.VERSION}}"
      - git push origin v{{.VERSION}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/ cover/ .task/

  ci:
    desc: Full CI pipeline (lint + test + build)
    cmds:
      - task: lint
      - task: test
      - task: build
